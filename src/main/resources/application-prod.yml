spring:
  config:
    import: "optional:configserver:"    # configserver import 활성화

  cloud:
    config:
      enabled: true
      profile: prod # config-repo의 prod 프로필 사용
      label: main   # config-repo 의 main 브랜치 사용
      discovery:
        enabled: true                   # Eureka를 통해 Config Server 찾기
        service-id: chaekmate-config    # Eureka 서비스 이름
      fail-fast: true


eureka:
  client:

    fetch-registry: true
    register-with-eureka: true

    service-url:
      defaultZone: ${EUREKA_URL_PROD}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# ===== RabbitMQ 설정 (Prod) =====
rabbitmq:
  member:
    exchange: prod-cm-member-fanout-exchange
    coupon-queue: prod-cm-member-signup-coupon-queue
    coupon-dlq: prod-cm-member-signup-coupon-dlq
